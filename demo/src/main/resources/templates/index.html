<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIU — Gestión de Incidencias Urbanas</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Sora', system-ui, sans-serif;
            background: linear-gradient(rgba(15,23,42,.45), rgba(15,23,42,.45)), url('/images/giu.jpg') center/cover fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,.09);
            padding: 52px 44px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo-mark {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 15px;
            background: linear-gradient(135deg, #052e16, #14532d);
            box-shadow: 0 8px 24px rgba(5,46,22,.45);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .logo-mark::before {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1.5px solid rgba(255,255,255,.28);
            border-radius: 9px;
        }
        .logo-mark::after {
            content: "";
            position: absolute;
            right: -6px; top: -6px;
            width: 20px; height: 20px;
            border-radius: 8px;
            background: rgba(255,255,255,.18);
        }
        h1 {
            font-size: 1.45rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: .875rem;
            color: #64748b;
            line-height: 1.55;
            margin-bottom: 36px;
        }
        .btn {
            display: block;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: .9rem;
            font-weight: 600;
            text-decoration: none;
            transition: background .14s, box-shadow .14s;
            margin-bottom: 10px;
            font-family: inherit;
        }
        .btn-primary { background: #15803d; color: #fff; border: none; }
        .btn-primary:hover { background: #14532d; box-shadow: 0 4px 14px rgba(21,128,61,.35); }
        .btn-outline { background: transparent; color: #15803d; border: 2px solid #15803d; }
        .btn-outline:hover { background: #f0fdf4; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-mark"><span style="position:relative;z-index:1;color:#fff;font-size:.92rem;font-weight:800;letter-spacing:.08em;">GIU</span></div>
        <h1>Gestión de Incidencias Urbanas</h1>
        <p class="tagline">Portal municipal para el reporte y seguimiento de incidencias en la vía pública.</p>
        <a href="/login" class="btn btn-primary">Iniciar sesión</a>
        <a href="/registro" class="btn btn-outline">Crear cuenta nueva</a>
    </div>
</body>
</html>

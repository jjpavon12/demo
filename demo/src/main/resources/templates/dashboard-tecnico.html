<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Técnico — GIU</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --accent: #0284c7; --accent-dark: #0369a1; --accent-bg: #f0f9ff; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; }
        nav.navbar {
            background: var(--accent);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            box-shadow: 0 1px 4px rgba(0,0,0,.15);
        }
        .nav-brand { display: flex; align-items: center; gap: 10px; }
        .nav-logo {
            background: rgba(255,255,255,.2);
            color: #fff;
            width: 34px; height: 34px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: .8rem; font-weight: 700;
        }
        .nav-title { color: #fff; font-weight: 600; font-size: .95rem; }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .nav-email { color: rgba(255,255,255,.8); font-size: .8rem; }
        .nav-role {
            background: rgba(255,255,255,.2);
            color: #fff;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: .73rem;
            font-weight: 600;
        }
        .nav-logout {
            color: #fff;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            background: rgba(255,255,255,.15);
            font-size: .82rem;
            font-weight: 500;
            transition: background .14s;
        }
        .nav-logout:hover { background: rgba(255,255,255,.28); }
        .container { max-width: 1200px; margin: 32px auto; padding: 0 24px; }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .page-header h2 { font-size: 1.1rem; font-weight: 700; color: #0f172a; }
        .stat-chip {
            background: var(--accent-bg);
            color: var(--accent-dark);
            border: 1px solid #bae6fd;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: .8rem;
            font-weight: 600;
        }
        .quick-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 28px; }
        .quick-card {
            background: #fff;
            border-radius: 10px;
            padding: 16px 18px;
            box-shadow: 0 1px 3px rgba(0,0,0,.07);
            border-left: 3px solid var(--accent);
        }
        .quick-card h4 { font-size: .84rem; font-weight: 600; color: #0f172a; margin-bottom: 4px; }
        .quick-card p { font-size: .77rem; color: #94a3b8; line-height: 1.4; }
        .section-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.07);
            overflow: hidden;
        }
        .section-header {
            padding: 16px 22px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-header h3 { font-size: .95rem; font-weight: 600; color: #0f172a; }
        .empty-msg {
            padding: 48px 24px;
            text-align: center;
            color: #94a3b8;
            font-size: .9rem;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #f8fafc;
            padding: 11px 16px;
            text-align: left;
            font-size: .75rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: .5px;
            border-bottom: 1px solid #e2e8f0;
        }
        td {
            padding: 13px 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: .875rem;
            color: #334155;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }
        .td-id { color: #94a3b8; font-size: .8rem; }
        .cat-tag {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: .73rem;
            font-weight: 600;
            margin: 1px 3px 1px 0;
        }
        .desc-link {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            font-size: .82rem;
            font-weight: 500;
            border-bottom: 1px dashed var(--accent);
        }
        .desc-link:hover { color: var(--accent-dark); }
        .estado-select {
            padding: 5px 10px;
            border: 1.5px solid #e2e8f0;
            border-radius: 6px;
            font-size: .8rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: border-color .14s;
            outline: none;
            min-width: 150px;
        }
        .estado-select:focus { border-color: var(--accent); }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,.45);
        }
        .modal-content {
            background: #fff;
            margin: 6% auto;
            padding: 28px;
            border-radius: 12px;
            width: 90%;
            max-width: 580px;
            box-shadow: 0 8px 32px rgba(0,0,0,.18);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
        }
        .modal-header h3 { font-size: 1rem; font-weight: 600; color: #0f172a; margin: 0; }
        .close-modal { color: #94a3b8; font-size: 1.4rem; cursor: pointer; line-height: 1; }
        .close-modal:hover { color: #374151; }
        .modal-body { color: #475569; font-size: .9rem; line-height: 1.65; margin-bottom: 20px; }
        .modal-footer button {
            padding: 8px 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: .85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background .14s;
        }
        .modal-footer button:hover { background: var(--accent-dark); }
        #map-tecnico {
            height: 400px;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.07);
            margin-bottom: 28px;
            z-index: 0;
        }
        .map-section-title {
            font-size: .95rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 12px;
        }
        .map-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            font-size: .78rem;
        }
        .map-legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .map-legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 2px rgba(0,0,0,.2);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <div class="nav-logo">GIU</div>
            <span class="nav-title">Panel Técnico</span>
        </div>
        <div class="nav-right">
            <span class="nav-email" th:text="${usuario.email}"></span>
            <span class="nav-role" th:text="${rol}"></span>
            <a href="/logout" class="nav-logout">Cerrar sesión</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Incidencias</h2>
            <span class="stat-chip" th:text="'Total: ' + ${#lists.size(incidencias)}"></span>
        </div>

        <!-- Mapa de incidencias -->
        <p class="map-section-title">🗺️ Mapa de incidencias</p>
        <div class="map-legend">
            <span class="map-legend-item"><span class="map-legend-dot" style="background:#f59e0b"></span> Pendiente</span>
            <span class="map-legend-item"><span class="map-legend-dot" style="background:#4ade80"></span> Validada</span>
            <span class="map-legend-item"><span class="map-legend-dot" style="background:#818cf8"></span> Asignada</span>
            <span class="map-legend-item"><span class="map-legend-dot" style="background:#60a5fa"></span> En curso</span>
            <span class="map-legend-item"><span class="map-legend-dot" style="background:#34d399"></span> Resuelta</span>
            <span class="map-legend-item"><span class="map-legend-dot" style="background:#94a3b8"></span> Cerrada</span>
            <span class="map-legend-item"><span class="map-legend-dot" style="background:#f87171"></span> Rechazada</span>
        </div>
        <div id="map-tecnico"></div>

        <div class="section-card">
            <div class="section-header">
                <h3>Listado de incidencias</h3>
            </div>
            <div th:if="${#lists.isEmpty(incidencias)}" class="empty-msg">
                No hay incidencias registradas.
            </div>
            <table th:if="${!#lists.isEmpty(incidencias)}">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Ubicación</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inc : ${incidencias}">
                        <td class="td-id" th:text="${inc.id}"></td>
                        <td>
                            <span class="cat-tag" th:each="cat : ${inc.categorias}" th:text="${cat.descripcion}"></span>
                        </td>
                        <td><span class="desc-link" th:onclick="'openModal(this)'" th:data-desc="${inc.descripcion}">Ver descripción</span></td>
                        <td th:text="${inc.ubicacion}"></td>
                        <td th:text="${#temporals.format(inc.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <form method="post"
                                  th:action="@{/dashboard/tecnico/cambiar-estado}">
                                <input type="hidden" name="id" th:value="${inc.id}"/>
                                <select name="estado" class="estado-select" onchange="if (this.value) { applySelectStyle(this); this.form.submit(); }">
                                    <option value="" th:text="${inc.estado.descripcion}"></option>
                                    <option th:each="e : ${estados}" th:value="${e}" th:text="${e.descripcion}"
                                            th:if="${e != inc.estado}"></option>
                                </select>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="descModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Descripción de la incidencia</h3>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <p id="descContent" class="modal-body"></p>
            <div class="modal-footer">
                <button onclick="closeModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
    /* --- Estado colors --- */
    var statusColors = {
        PENDIENTE_VALIDACION: { bg: '#fef3c7', color: '#92400e', border: '#f59e0b' },
        VALIDADA:             { bg: '#dcfce7', color: '#166534', border: '#4ade80' },
        ASIGNADA:             { bg: '#e0e7ff', color: '#3730a3', border: '#818cf8' },
        EN_CURSO:             { bg: '#dbeafe', color: '#1e40af', border: '#60a5fa' },
        RESUELTA:             { bg: '#d1fae5', color: '#065f46', border: '#34d399' },
        CERRADA:              { bg: '#e2e8f0', color: '#334155', border: '#94a3b8' },
        RECHAZADA:            { bg: '#fee2e2', color: '#991b1b', border: '#f87171' }
    };
    function applySelectStyle(sel) {
        var s = statusColors[sel.value];
        if (s) { sel.style.background=s.bg; sel.style.color=s.color; sel.style.borderColor=s.border; return; }
        sel.style.background='#fff'; sel.style.color='#334155'; sel.style.borderColor='#e2e8f0';
    }
    document.querySelectorAll('.estado-select').forEach(function(sel){ applySelectStyle(sel); });

    /* --- Modal --- */
    function openModal(el) {
        document.getElementById('descContent').textContent = el.getAttribute('data-desc');
        document.getElementById('descModal').style.display = 'block';
    }
    function closeModal() { document.getElementById('descModal').style.display = 'none'; }
    document.addEventListener('click', function(e) {
        if (e.target === document.getElementById('descModal')) closeModal();
    });

    /* --- Mapa Leaflet técnico --- */
    var estadoColorsMap = {
        PENDIENTE_VALIDACION: '#f59e0b',
        VALIDADA: '#4ade80',
        ASIGNADA: '#818cf8',
        EN_CURSO: '#60a5fa',
        RESUELTA: '#34d399',
        CERRADA: '#94a3b8',
        RECHAZADA: '#f87171'
    };

    var mapTec = L.map('map-tecnico').setView([40.4168, -3.7038], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(mapTec);

    fetch('/api/incidencias')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var bounds = [];
            data.forEach(function(inc) {
                if (inc.latitud && inc.longitud) {
                    var color = estadoColorsMap[inc.estado] || '#64748b';
                    var circle = L.circleMarker([inc.latitud, inc.longitud], {
                        radius: 9,
                        fillColor: color,
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.85
                    }).addTo(mapTec);
                    circle.bindPopup(
                        '<strong>#' + inc.id + '</strong> — ' + inc.categorias.join(', ') + '<br/>' +
                        '<span style="color:' + color + ';font-weight:600">' + inc.estadoDesc + '</span><br/>' +
                        inc.descripcion.substring(0, 120) + (inc.descripcion.length > 120 ? '...' : '') + '<br/>' +
                        '<small>📍 ' + inc.ubicacion + '</small><br/>' +
                        '<small>🗓 ' + inc.fecha + '</small>'
                    );
                    bounds.push([inc.latitud, inc.longitud]);
                }
            });
            if (bounds.length > 0) {
                mapTec.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Técnico — GIU</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --accent: #0284c7; --accent-dark: #0369a1; --accent-bg: #f0f9ff; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; }
        nav.navbar {
            background: var(--accent);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            box-shadow: 0 1px 4px rgba(0,0,0,.15);
        }
        .nav-brand { display: flex; align-items: center; gap: 10px; }
        .nav-logo {
            background: rgba(255,255,255,.2);
            color: #fff;
            width: 34px; height: 34px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: .8rem; font-weight: 700;
        }
        .nav-title { color: #fff; font-weight: 600; font-size: .95rem; }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .nav-email { color: rgba(255,255,255,.8); font-size: .8rem; }
        .nav-role {
            background: rgba(255,255,255,.2);
            color: #fff;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: .73rem;
            font-weight: 600;
        }
        .nav-logout {
            color: #fff;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            background: rgba(255,255,255,.15);
            font-size: .82rem;
            font-weight: 500;
            transition: background .14s;
        }
        .nav-logout:hover { background: rgba(255,255,255,.28); }
        .container { max-width: 1200px; margin: 32px auto; padding: 0 24px; }
        .section-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.07);
            overflow: hidden;
        }
        .section-header {
            padding: 16px 22px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-header h3 { font-size: .95rem; font-weight: 600; color: #0f172a; }
        .empty-msg {
            padding: 48px 24px;
            text-align: center;
            color: #94a3b8;
            font-size: .9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <div class="nav-logo">GIU</div>
            <span class="nav-title">Panel Técnico</span>
        </div>
        <div class="nav-right">
            <span class="nav-email" th:text="${usuario.email}"></span>
            <span class="nav-role" th:text="${rol}"></span>
            <a href="/logout" class="nav-logout">Cerrar sesión</a>
        </div>
    </nav>

    <div class="container">
        <div class="section-card" style="max-width: 720px; margin: 60px auto; text-align: center;">
            <div class="section-header" style="justify-content: center;">
                <h3>Panel Técnico</h3>
            </div>
            <div class="empty-msg" style="padding: 64px 24px; font-size: 1rem;">
                Próximamente
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — GIU</title>
    <link rel="icon" th:href="@{/images/dibujo.png}" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(rgba(15,23,42,.45), rgba(15,23,42,.45)), url('/images/giu.jpg') center/cover fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,.09);
            padding: 44px 40px;
            width: 100%;
            max-width: 390px;
        }
        .card-header { text-align: center; margin-bottom: 28px; }
        .logo-mark {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 15px;
            background: linear-gradient(135deg, #052e16, #14532d);
            box-shadow: 0 8px 24px rgba(5,46,22,.45);
            overflow: hidden;
            margin-bottom: 14px;
        }
        .logo-mark::before {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1.5px solid rgba(255,255,255,.28);
            border-radius: 9px;
        }
        .logo-mark::after {
            content: "";
            position: absolute;
            right: -6px; top: -6px;
            width: 20px; height: 20px;
            border-radius: 8px;
            background: rgba(255,255,255,.18);
        }
        h1 { font-size: 1.3rem; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
        .subtitle { font-size: .85rem; color: #64748b; }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: .78rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 13px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: .925rem;
            font-family: inherit;
            color: #1e293b;
            background: #fff;
            transition: border-color .14s, box-shadow .14s;
        }
        input:focus { outline: none; border-color: #15803d; box-shadow: 0 0 0 3px rgba(21,128,61,.12); }
        .btn-submit {
            width: 100%;
            padding: 11px;
            background: #15803d;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: .9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 4px;
            transition: background .14s, box-shadow .14s;
        }
        .btn-submit:hover { background: #14532d; box-shadow: 0 4px 14px rgba(21,128,61,.35); }
        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 9px 13px;
            border-radius: 8px;
            font-size: .85rem;
            margin-bottom: 14px;
            text-align: center;
        }
        .info-msg {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
            padding: 9px 13px;
            border-radius: 8px;
            font-size: .85rem;
            margin-bottom: 14px;
            text-align: center;
        }
        .footer-link { text-align: center; margin-top: 20px; font-size: .85rem; color: #64748b; }
        .footer-link a { color: #15803d; font-weight: 500; text-decoration: none; }
        .footer-link a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .card { padding: 28px 18px; }
            .main-wrap { padding: 24px 12px; }
        }
    </style>
</head>
<body>
<main class="main-wrap">
    <div class="card">
        <div class="card-header">
            <div class="logo-mark"><span style="position:relative;z-index:1;color:#fff;font-size:.92rem;font-weight:800;letter-spacing:.08em;">GIU</span></div>
            <h1>Bienvenido de nuevo</h1>
            <p class="subtitle">Accede con tu cuenta</p>
        </div>

        <div th:if="${param.error}" class="error-msg">
            Correo o contraseña incorrectos, o tu cuenta aún no ha sido aprobada.
        </div>
        <div th:if="${registeredMessage}" class="alert-info" style="background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;padding:9px 13px;border-radius:8px;margin-bottom:14px;text-align:center;" th:text="${registeredMessage}"></div>
        <div th:if="${pendienteMessage}" class="alert-info" style="background:#fff7ed;border:1px solid #fed7aa;color:#c2410c;padding:9px 13px;border-radius:8px;margin-bottom:14px;text-align:center;" th:text="${pendienteMessage}"></div>

        <form method="POST" th:action="@{/login}">
            <div class="form-group">
                <label for="username">Correo electrónico</label>
                <input type="text" id="username" name="username" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Iniciar sesión</button>
        </form>

        <div class="footer-link">
            ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
        </div>
    </div>
</main>
<footer style="width:100%;background:rgba(15,23,42,.95);color:#94a3b8;text-align:center;padding:24px 16px;font-size:.82rem;margin-top:32px;">© 2025 GIU — Gestión de Incidencias Urbanas</footer>
</body>
</html>
